[build]
  command = "node scripts/build-static.mjs"
  environment = { NODE_VERSION = "22.12.0" }
  publish = "dist"

[build.processing]
  skip_processing = false

[[redirects]]
  from = "/simple"
  to = "/simple/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/simple/"
  to = "/simple/index.html"
  status = 200
  force = true
