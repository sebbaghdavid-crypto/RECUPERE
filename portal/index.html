<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RÉCUPÈRE — Mon dossier</title><style>
body{margin:0;background:#f7f4ec;color:#18352d;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:32px 20px}.logo{font-size:25px;font-weight:900}.card{background:#fffdf8;border:1px solid #dfe6df;border-radius:22px;padding:25px;margin-top:22px}.hero{padding:35px 0}.muted{color:#63756f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field input{padding:13px;border:1px solid #ccd7d0;border-radius:10px;font:inherit}.btn{border:0;border-radius:999px;background:#18352d;color:white;padding:13px 18px;font-weight:800;cursor:pointer}.badge{display:inline-block;background:#e4f1e7;color:#2d674f;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.analysis{background:#edf3ed;border-radius:16px;padding:18px}.claim{background:#f4f5f1;border-radius:16px;padding:18px;white-space:pre-wrap}.event{padding:11px 0;border-bottom:1px solid #e0e7e1}.error{color:#9b4d3e}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="logo">RÉCUPÈRE<span style="color:#2f6f5e">.</span></div><section class="hero"><h1>Mon dossier</h1><p class="muted">Retrouvez votre analyse, votre paiement et l'avancement de votre démarche.</p></section><div id="login" class="card"><h2>Accéder à mon dossier</h2><p class="muted">Utilisez le numéro de dossier reçu par email et l'adresse email utilisée lors de la demande.</p><div class="grid"><div class="field"><label>Dossier</label><input id="case" placeholder="REC-2026-XXXXXX"></div><div class="field"><label>Email</label><input id="email" type="email"></div></div><br><button class="btn" id="go">Voir mon dossier →</button><p id="err" class="error"></p></div><div id="portal" hidden></div></div><script>
const $=s=>document.querySelector(s);const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#039;"}[m]));
function render(c){$("login").hidden=true;const analysis=c.analysisLabel?'<div class="analysis"><b>'+esc(c.analysisLabel)+'</b><p>'+esc(c.analysisSummary||"")+'</p>'+(c.estimatedRecovery!=null?'<strong>Récupération estimée : '+esc(c.estimatedRecovery)+' €</strong>':'')+'</div>':"";
const payment=c.payment?.status==="paid"?'<p><span class="badge">Paiement confirmé — 9,90 €</span></p>':c.status==="PAYMENT_REQUIRED"?'<p><span class="badge">Paiement requis — 9,90 €</span></p>':"";
const claim=c.claim?'<div class="card"><h2>Réclamation préparée</h2><p><b>'+esc(c.claim.subject)+'</b></p><div class="claim">'+esc(c.claim.body)+'</div><p class="muted">Cette réclamation doit être relue et validée avant tout envoi.</p></div>':"";
const events=(c.events||[]).slice().reverse().map(e=>'<div class="event"><b>'+esc(e.type)+'</b><br><span class="muted">'+new Date(e.at).toLocaleString("fr-FR")+'</span></div>').join("");
$("portal").innerHTML='<div class="card"><div><span class="badge">'+esc(c.status)+'</span></div><h2>'+esc(c.caseNumber)+'</h2><p class="muted">'+esc(c.name)+' · '+esc(c.email)+'</p>'+analysis+payment+'</div>'+claim+'<div class="card"><h2>Historique</h2>'+events+'</div>'; $("portal").hidden=false}
async function load(){const c=$('#case').value.trim(),e=$('#email').value.trim();$('#err').textContent="";const r=await fetch('/api/portal?case='+encodeURIComponent(c)+'&email='+encodeURIComponent(e));const d=await r.json();if(!r.ok){$('#err').textContent=d.error||"Accès impossible.";return}localStorage.setItem("recupere_portal_case",c);localStorage.setItem("recupere_portal_email",e);render(d)}
$('#go').onclick=load;$('#case').value=localStorage.getItem("recupere_portal_case")||new URLSearchParams(location.search).get("case")||"";$('#email').value=localStorage.getItem("recupere_portal_email")||new URLSearchParams(location.search).get("email")||"";if($('#case').value&&$('#email').value)load();
</script></body></html>
