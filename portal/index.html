<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RÉCUPÈRE — Mon dossier</title><style>
body{margin:0;background:#f7f4ec;color:#18352d;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:32px 20px}.logo{font-size:25px;font-weight:900}.card{background:#fffdf8;border:1px solid #dfe6df;border-radius:22px;padding:25px;margin-top:22px}.hero{padding:35px 0}.muted{color:#63756f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field input{padding:13px;border:1px solid #ccd7d0;border-radius:10px;font:inherit}.btn{border:0;border-radius:999px;background:#18352d;color:white;padding:13px 18px;font-weight:800;cursor:pointer}.badge{display:inline-block;background:#e4f1e7;color:#2d674f;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.analysis{background:#edf3ed;border-radius:16px;padding:18px}.claim{background:#f4f5f1;border-radius:16px;padding:18px;white-space:pre-wrap}.event{padding:11px 0;border-bottom:1px solid #e0e7e1}.error{color:#9b4d3e}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="logo">RÉCUPÈRE<span style="color:#2f6f5e">.</span></div><section class="hero"><h1>Mon dossier</h1><p class="muted">Retrouvez votre analyse, votre paiement et l'avancement de votre démarche.</p></section><div id="loading" class="card" role="status" aria-live="polite"><p class="muted">Vérification de votre espace sécurisé…</p></div><div id="login" class="card" hidden><h2>Accéder à mon espace</h2><p class="muted">Recevez un lien de connexion sécurisé par e-mail. Aucun mot de passe à retenir.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="toi@exemple.fr"></div><br><button class="btn" id="go">Recevoir mon lien →</button><p id="msg" class="muted"></p><p id="err" class="error"></p></div><div id="portal" hidden></div></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function get(url="/api/portal"){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),8000);try{const r=await fetch(url,{cache:"no-store",signal:controller.signal}),d=await r.json();if(!r.ok)throw Error(d.error||"Erreur");return d}catch(e){if(e.name==="AbortError")throw Error("La vérification prend trop de temps. Réessayez.");throw e}finally{clearTimeout(timer)}}
function render(c){$("#loading").hidden=true;$("#login").hidden=true;const analysis=c.analysisLabel?'<div class="analysis"><b>'+esc(c.analysisLabel)+'</b><p>'+esc(c.analysisSummary||"")+'</p>'+(c.estimatedRecovery!=null?'<strong>Récupération estimée : '+esc(c.estimatedRecovery)+' €</strong>':"")+"</div>":"",routing='<div class="card" id="routingCard"><h2>Identifier le bon interlocuteur</h2><p class="muted">RÉCUPÈRE compare les indices au référentiel de sources officielles. Un numéro seul ne suffit pas. Aucun message ne sera envoyé et cette analyse ne conserve pas les références saisies.</p><div class="grid"><div class="field"><label for="routeMerchant">Marchand / organisme</label><input id="routeMerchant" maxlength="180" value="'+esc(c.company||"")+'"></div><div class="field"><label for="routeDomain">Domaine officiel (facultatif)</label><input id="routeDomain" maxlength="253" placeholder="exemple.fr"></div><div class="field"><label for="routeOrder">N° de commande / référence</label><input id="routeOrder" maxlength="180" value="'+esc(c.reference||"")+'"></div><div class="field"><label for="routeInvoice">N° de facture (facultatif)</label><input id="routeInvoice" maxlength="180"></div></div><p><label><input id="routeConsent" type="checkbox"> J’accepte que ces informations soient analysées pour identifier le bon interlocuteur.</label></p><button class="btn" id="routeSubmit" type="button">Rechercher le bon interlocuteur →</button><p id="routeMsg" class="muted" aria-live="polite"></p><div id="routeResults"></div></div>',payment=c.payment?.status==="paid"?'<p><span class="badge">Paiement confirmé — 9,90 €</span></p>':c.status==="PAYMENT_REQUIRED"?'<div class="card"><p><span class="badge">Paiement requis — 9,90 €</span></p><p class="muted">Le paiement est traité de manière sécurisée par Stripe. La préparation de la réclamation ne commence qu’après confirmation du paiement.</p><button class="btn" id="portalPay">Payer 9,90 € →</button><p id="payError" class="error"></p></div>':"",claim=c.claim?'<div class="card"><h2>Réclamation préparée</h2><p><b>'+esc(c.claim.subject)+'</b></p><div class="claim">'+esc(c.claim.body)+'</div><p class="muted">Cette réclamation doit être relue et validée avant tout envoi.</p></div>':"",events=(c.events||[]).slice().reverse().map(e=>'<div class="event"><b>'+esc(e.type)+'</b><br><span class="muted">'+new Date(e.at).toLocaleString("fr-FR")+"</span></div>").join("");$("#portal").innerHTML='<div class="card"><button class="btn alt" onclick="loadCases()">← Mes dossiers</button><div style="margin-top:18px"><span class="badge">'+esc(c.status)+'</span></div><h2>'+esc(c.caseNumber)+'</h2><p class="muted">'+esc(c.name)+" · "+esc(c.email)+"</p>"+analysis+routing+payment+"</div>"+claim+'<div class="card"><h2>Historique</h2>'+events+"</div>";$("#portal").hidden=false;const pay=$("#portalPay");if(pay)pay.onclick=()=>startPayment(c.caseNumber);const routeBtn=$("#routeSubmit");if(routeBtn)routeBtn.onclick=()=>routeProvider()}
function renderCases(d){$("#loading").hidden=true;$("#login").hidden=true;const rows=(d.cases||[]).map(c=>'<div class="case"><div><b>'+esc(c.caseNumber)+'</b><br><span class="muted">'+esc(c.status)+" · "+(c.createdAt?new Date(c.createdAt).toLocaleDateString("fr-FR"):"")+'</span></div><button class="btn" type="button" data-case="'+esc(encodeURIComponent(c.caseNumber))+'">Ouvrir →</button></div>').join("");$("#portal").innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2>Mes dossiers</h2><button class="btn alt" type="button" id="logout">Se déconnecter</button></div>'+(rows||'<p class="muted">Aucun dossier trouvé.</p>')+"</div>";$("#portal").hidden=false;$("#portal").querySelectorAll("[data-case]").forEach(button=>button.addEventListener("click",()=>loadCase(button.dataset.case)));$("#logout").addEventListener("click",logout)}
async function routeProvider(){const button=$("#routeSubmit"),msg=$("#routeMsg"),results=$("#routeResults");if(!$("#routeConsent").checked){msg.textContent="Veuillez confirmer votre accord avant l’analyse.";return}const payload={consent:true,merchant:$("#routeMerchant").value.trim(),merchant_domain:$("#routeDomain").value.trim(),order_number:$("#routeOrder").value.trim(),invoice_number:$("#routeInvoice").value.trim()};if(!payload.merchant&&!payload.merchant_domain&&!payload.order_number&&!payload.invoice_number){msg.textContent="Indiquez au moins le marchand, le domaine ou une référence.";return}button.disabled=true;button.textContent="Analyse en cours…";msg.textContent="";results.innerHTML="";try{const response=await fetch("/api/claim-routing",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload),cache:"no-store"}),data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||"Analyse indisponible.");const result=data.result||{},candidates=Array.isArray(result.candidates)?result.candidates:[];msg.textContent=result.explanation||"Analyse terminée.";if(!candidates.length){results.innerHTML='<p class="muted">Aucun fournisseur n’a été identifié dans le référentiel actuel. Ajoutez le nom exact ou le domaine officiel ; ne vous fiez pas au numéro seul.</p>';return}results.innerHTML=candidates.map(candidate=>'<div class="analysis" style="margin-top:12px"><b>'+esc(candidate.display_name)+'</b><p>Niveau de confiance : '+esc(result.confidence)+'</p><ul>'+(candidate.evidence||[]).map(item=>'<li>'+esc(item.detail)+'</li>').join("")+'</ul><p>'+(candidate.official_urls||[]).map(url=>'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Page officielle de contact / réclamation ↗</a>').join("<br>")+'</p><p>'+(candidate.source_urls||[]).map(url=>'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">Source de référence ↗</a>').join("<br>")+'</p></div>').join("");}catch(error){msg.textContent=error.message||"Analyse indisponible. Réessayez."}finally{button.disabled=false;button.textContent="Rechercher le bon interlocuteur →"}}
async function startPayment(caseNumber){const pay=$("#portalPay"),err=$("#payError");if(pay){pay.disabled=true;pay.textContent="Préparation du paiement…"}if(err)err.textContent="";try{const r=await fetch("/api/payment",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({caseNumber})});const d=await r.json();if(!r.ok)throw Error(d.error||"Paiement indisponible.");if(d.alreadyPaid){await loadCase(caseNumber);return}if(!d.checkoutUrl)throw Error("Lien de paiement indisponible.");location.href=d.checkoutUrl}catch(e){if(err)err.textContent=e.message||"Paiement indisponible.";if(pay){pay.disabled=false;pay.textContent="Réessayer le paiement →"}}}
async function loadCase(n){try{render(await get("/api/portal?case="+n))}catch(e){$("#err").textContent=e.message}}
async function loadCases(){try{const d=await get();$("#loading").hidden=true;if(!d.authenticated){$("#login").hidden=false;$("#portal").hidden=true;return}renderCases(d)}catch(e){$("#loading").hidden=true;$("#login").hidden=false;$("#portal").hidden=true;$("#err").textContent=e.message==="La vérification prend trop de temps. Réessayez."?e.message:"Connexion momentanément indisponible. Réessayez dans quelques instants."}}
async function requestLink(){const e=$("#email").value.trim();$("#err").textContent="";$("#msg").textContent="";if(!e){$("#err").textContent="Saisissez votre adresse e-mail.";return}const button=$("#go");button.disabled=true;button.textContent="Envoi en cours…";try{const r=await fetch("/api/portal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"request_link",email:e})}),d=await r.json().catch(()=>({}));if(!r.ok){$("#err").textContent=d.error||"Impossible d'envoyer le lien pour le moment.";return}$("#msg").textContent="Si un dossier correspond à cette adresse, un lien de connexion vient d'être envoyé."}catch(error){$("#err").textContent="Connexion momentanément indisponible. Vérifiez votre connexion puis réessayez."}finally{button.disabled=false;button.textContent="Recevoir mon lien →"}}
async function logout(){await fetch("/api/portal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"logout"})});location.href="/portal/"}
function load(){const u=new URL(location.href);const magic=u.searchParams.get("magic");if(magic){location.replace("/api/portal?magic="+encodeURIComponent(magic));return}loadCases()}
$("#go").onclick=requestLink;load();
</script></body></html>
