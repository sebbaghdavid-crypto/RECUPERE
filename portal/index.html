<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RÉCUPÈRE — Mon dossier</title><style>
body{margin:0;background:#f7f4ec;color:#18352d;font-family:system-ui,sans-serif}.wrap{max-width:900px;margin:auto;padding:32px 20px}.logo{font-size:25px;font-weight:900}.card{background:#fffdf8;border:1px solid #dfe6df;border-radius:22px;padding:25px;margin-top:22px}.hero{padding:35px 0}.muted{color:#63756f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field input{padding:13px;border:1px solid #ccd7d0;border-radius:10px;font:inherit}.btn{border:0;border-radius:999px;background:#18352d;color:white;padding:13px 18px;font-weight:800;cursor:pointer}.badge{display:inline-block;background:#e4f1e7;color:#2d674f;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800}.analysis{background:#edf3ed;border-radius:16px;padding:18px}.claim{background:#f4f5f1;border-radius:16px;padding:18px;white-space:pre-wrap}.event{padding:11px 0;border-bottom:1px solid #e0e7e1}.error{color:#9b4d3e}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="logo">RÉCUPÈRE<span style="color:#2f6f5e">.</span></div><section class="hero"><h1>Mon dossier</h1><p class="muted">Retrouvez votre analyse, votre paiement et l'avancement de votre démarche.</p></section><div id="login" class="card"><h2>Accéder à mon espace</h2><p class="muted">Recevez un lien de connexion sécurisé par e-mail. Aucun mot de passe à retenir.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="toi@exemple.fr"></div><br><button class="btn" id="go">Recevoir mon lien →</button><p id="msg" class="muted"></p><p id="err" class="error"></p></div><div id="portal" hidden></div></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function get(url="/api/portal"){const r=await fetch(url,{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Erreur");return d}
function render(c){$("#login").hidden=true;const analysis=c.analysisLabel?'<div class="analysis"><b>'+esc(c.analysisLabel)+'</b><p>'+esc(c.analysisSummary||"")+'</p>'+(c.estimatedRecovery!=null?'<strong>Récupération estimée : '+esc(c.estimatedRecovery)+' €</strong>':"")+"</div>":"",payment=c.payment?.status==="paid"?'<p><span class="badge">Paiement confirmé — 9,90 €</span></p>':c.status==="PAYMENT_REQUIRED"?'<p><span class="badge">Paiement requis — 9,90 €</span></p>':"",claim=c.claim?'<div class="card"><h2>Réclamation préparée</h2><p><b>'+esc(c.claim.subject)+'</b></p><div class="claim">'+esc(c.claim.body)+'</div><p class="muted">Cette réclamation doit être relue et validée avant tout envoi.</p></div>':"",events=(c.events||[]).slice().reverse().map(e=>'<div class="event"><b>'+esc(e.type)+'</b><br><span class="muted">'+new Date(e.at).toLocaleString("fr-FR")+"</span></div>").join("");$("#portal").innerHTML='<div class="card"><button class="btn alt" onclick="loadCases()">← Mes dossiers</button><div style="margin-top:18px"><span class="badge">'+esc(c.status)+'</span></div><h2>'+esc(c.caseNumber)+'</h2><p class="muted">'+esc(c.name)+" · "+esc(c.email)+"</p>"+analysis+payment+"</div>"+claim+'<div class="card"><h2>Historique</h2>'+events+"</div>";$("#portal").hidden=false}
function renderCases(d){$("#login").hidden=true;const rows=(d.cases||[]).map(c=>'<div class="case"><div><b>'+esc(c.caseNumber)+'</b><br><span class="muted">'+esc(c.status)+" · "+(c.createdAt?new Date(c.createdAt).toLocaleDateString("fr-FR"):"")+"</span></div><button class="btn" onclick="loadCase(\""+encodeURIComponent(c.caseNumber)+"\")">Ouvrir →</button></div>").join("");$("#portal").innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2>Mes dossiers</h2><button class="btn alt" onclick="logout()">Se déconnecter</button></div>'+(rows||'<p class="muted">Aucun dossier trouvé.</p>')+"</div>";$("#portal").hidden=false}
async function loadCase(n){try{render(await get("/api/portal?case="+n))}catch(e){$("#err").textContent=e.message}}
async function loadCases(){try{const d=await get();if(!d.authenticated){$("#login").hidden=false;$("#portal").hidden=true;return}renderCases(d)}catch(e){$("#err").textContent=e.message}}
async function requestLink(){const e=$("#email").value.trim();$("#err").textContent="";$("#msg").textContent="";const r=await fetch("/api/portal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"request_link",email:e})}),d=await r.json();if(!r.ok){$("#err").textContent="Impossible d'envoyer le lien pour le moment.";return}$("#msg").textContent="Si un dossier correspond à cette adresse, un lien de connexion vient d'être envoyé."}
async function logout(){await fetch("/api/portal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"logout"})});location.href="/portal/"}
function load(){const u=new URL(location.href);if(u.searchParams.has("magic"))history.replaceState({},document.title,"/portal/");loadCases()}
$("#go").onclick=requestLink;load();
</script></body></html>
