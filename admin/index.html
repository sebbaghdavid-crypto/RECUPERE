<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RÉCUPÈRE — Administration</title>
<style>
body{margin:0;background:#f7f4ec;color:#18352d;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 20px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px}.logo{font-size:25px;font-weight:900}.logo span{color:#2f6f5e}.card{background:#fffdf8;border:1px solid #dfe6df;border-radius:18px;padding:20px;margin:18px 0}.login{max-width:520px;margin:80px auto}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.field{display:grid;gap:7px;flex:1}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cfd9d2;border-radius:10px;box-sizing:border-box;font:inherit}.btn{border:0;border-radius:999px;background:#18352d;color:white;padding:11px 16px;font-weight:800;cursor:pointer}.btn.light{background:white;color:#18352d;border:1px solid #dfe6df}.muted{color:#63756f}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#edf3ed;border-radius:16px;padding:16px}.stat b{font-size:28px}.case{border-top:1px solid #e4e9e5;padding:18px 0}.case:first-child{border-top:0}.case-head{display:flex;justify-content:space-between;gap:16px}.badge{display:inline-block;border-radius:99px;padding:5px 9px;background:#e4f1e7;font-size:12px;font-weight:800}.small{font-size:13px}.timeline{margin-top:12px;padding-left:16px;border-left:2px solid #dce9df}.event{margin:8px 0}.notice{padding:12px;border-radius:12px;background:#fff4d9;color:#6d5316}.error{color:#9b4d3e;margin-top:10px}.ok{color:#2f6f5e;margin-top:10px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.case-head{display:block}}
</style></head><body><div class="wrap">
<div class="top"><div class="logo">RÉCUPÈRE<span>•</span>ADMIN</div><button class="btn light" id="logout">Déconnexion</button></div>
<div id="login" class="card login"><h1>Administration</h1><p class="muted">Accès privé aux dossiers RÉCUPÈRE.</p><div class="field"><label>Clé administrateur</label><input id="key" type="password" autocomplete="current-password"></div><br><button class="btn" id="loginBtn">Accéder aux dossiers</button><div id="loginError" class="error"></div><div class="notice" style="margin-top:18px">La clé n'est jamais enregistrée dans le dépôt. Elle doit être configurée côté Netlify.</div></div>
<div id="app" hidden><div class="stats" id="stats"></div><div class="card"><div class="row"><div class="field"><label>Recherche</label><input id="search" placeholder="REC-2026…, email, entreprise…"></div><div class="field"><label>Statut</label><select id="statusFilter"><option value="">Tous</option><option>NEW</option><option>ANALYSIS</option><option>OPPORTUNITY</option><option>PAYMENT_REQUIRED</option><option>PAID</option><option>CLAIM_PREPARED</option><option>SENT</option><option>FOLLOW_UP</option><option>RECOVERED</option><option>CLOSED</option><option>NO_OPPORTUNITY</option><option>INCOMPLETE</option></select></div><button class="btn" id="refresh">Actualiser</button></div></div><div class="card"><div id="cases"></div></div></div>
</div>
<script>
let key=sessionStorage.getItem("recupere_admin_key")||"", cases=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
async function load(){const r=await fetch("/api/cases?admin=1",{headers:{"x-admin-key":key}});if(r.status===401)throw Error("Clé refusée");const d=await r.json();cases=d.cases||[];render();}
function render(){const q=$("#search").value.toLowerCase(), sf=$("#statusFilter").value;const list=cases.filter(c=>(!sf||c.status===sf)&&(!q||JSON.stringify(c).toLowerCase().includes(q)));const recovered=cases.filter(c=>c.status==="RECOVERED").length;$("#stats").innerHTML=[["Dossiers",cases.length],["À analyser",cases.filter(c=>["NEW","ANALYSIS"].includes(c.status)).length],["Opportunités",cases.filter(c=>c.status==="OPPORTUNITY").length],["Récupérés",recovered]].map(x=>'<div class="stat"><div class="muted small">'+x[0]+'</div><b>'+x[1]+'</b></div>').join("");$("#cases").innerHTML=list.length?list.map(c=>caseHtml(c)).join(""):'<p class="muted">Aucun dossier.</p>';list.forEach(c=>bindCase(c));}
function caseHtml(c){return '<article class="case"><div class="case-head"><div><b>'+esc(c.caseNumber)+'</b> <span class="badge">'+esc(c.status)+'</span><div class="muted small">'+esc(c.name)+' · '+esc(c.email)+' · '+esc(c.category)+'</div></div><div><b>'+esc(c.amount||"—")+' €</b></div></div><p>'+esc(c.description)+'</p><div class="row"><div class="field"><label>Statut</label><select id="st-'+c.accessToken+'">'+["NEW","ANALYSIS","OPPORTUNITY","PAYMENT_REQUIRED","PAID","CLAIM_PREPARED","SENT","FOLLOW_UP","RECOVERED","CLOSED","NO_OPPORTUNITY","INCOMPLETE","REFUNDED","CANCELLED"].map(s=>'<option '+(s===c.status?"selected":"")+'>'+s+'</option>').join("")+'</select></div><div class="field"><label>Note</label><input id="nt-'+c.accessToken+'" placeholder="Ajouter une note interne"></div><button class="btn save" data-token="'+c.accessToken+'">Enregistrer</button><button class="btn light prepare" data-token="'+c.accessToken+'">Préparer réclamation</button></div><div class="timeline">'+(c.events||[]).slice().reverse().map(e=>'<div class="event small"><b>'+esc(e.type)+'</b> · '+esc(new Date(e.at).toLocaleString("fr-FR"))+(e.status?' · '+esc(e.status):'')+(e.note?' — '+esc(e.note):'')+'</div>').join("")+'</div></article>'}
function bindCase(c){
const prepare=document.querySelector('.prepare[data-token="'+c.accessToken+'"]');
if(prepare)prepare.onclick=async()=>{const r=await fetch("/api/cases",{method:"POST",headers:{"content-type":"application/json","x-admin-key":key},body:JSON.stringify({action:"prepare_claim",accessToken:c.accessToken})});const d=await r.json();if(!r.ok){alert(d.error||"Impossible de préparer la réclamation.");return}alert((d.claim?.subject||"Réclamation préparée")+"\n\n"+(d.claim?.body||""));await load();};
document.querySelector('.save[data-token="'+c.accessToken+'"]').onclick=async()=>{const status=$("#st-"+c.accessToken).value,note=$("#nt-"+c.accessToken).value;const r=await fetch("/api/cases",{method:"POST",headers:{"content-type":"application/json","x-admin-key":key},body:JSON.stringify({action:"status",accessToken:c.accessToken,status,note})});if(!r.ok){alert("Impossible d'enregistrer.");return}await load();}}
$("#loginBtn").onclick=async()=>{key=$("#key").value.trim();try{await load();sessionStorage.setItem("recupere_admin_key",key);$("#login").hidden=true;$("#app").hidden=false}catch(e){$("#loginError").textContent="Clé refusée ou service indisponible.";key="";}};
$("#refresh").onclick=load;$("#search").oninput=render;$("#statusFilter").onchange=render;$("#logout").onclick=()=>{sessionStorage.removeItem("recupere_admin_key");location.reload()};
if(key)load().then(()=>{$("#login").hidden=true;$("#app").hidden=false}).catch(()=>{key=""});
</script></body></html>
