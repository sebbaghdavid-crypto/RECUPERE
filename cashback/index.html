<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RÉCUPÈRE Cashback</title><style>body{margin:0;background:#f7f4ec;color:#18352d;font-family:system-ui,sans-serif}.w{max-width:1000px;margin:auto;padding:32px 20px}.logo{font-size:25px;font-weight:900}.hero{padding:35px 0}.muted{color:#63756f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.c{background:#fffdf8;border:1px solid #dfe6df;border-radius:20px;padding:20px}.rate{font-size:30px;font-weight:900;margin:12px 0}.btn{border:0;border-radius:999px;background:#18352d;color:white;padding:12px 16px;font-weight:800;cursor:pointer}.note{background:#edf3ed;padding:15px;border-radius:14px}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style><div class="w"><div class="logo">RÉCUPÈRE<span style="color:#2f6f5e">.</span></div><div class="hero"><h1>Achète. Récupère. Cumule.</h1><p class="muted">Le cashback complète RÉCUPÈRE : offres partenaires, liens trackés et suivi des commissions.</p><div class="note"><b>Transparence :</b> aucun taux n'est inventé. Le cashback devient payable seulement après confirmation de la commission partenaire.</div></div><div id="offers" class="grid">Chargement…</div></div><script>const E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));async function go(){const r=await fetch("/api/cashback"),d=await r.json();offers.innerHTML=(d.offers||[]).map(o=>'<article class="c"><b>'+E(o.merchant)+'</b><div class="rate">'+(o.cashbackRate==null?"Bientôt":E(o.cashbackRate)+" %")+'</div><p class="muted">'+E(o.description)+'</p><button class="btn" data-id="'+E(o.id)+'">'+(o.trackingReady?"Activer le cashback →":"Découvrir →")+'</button></article>').join("");document.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{const r=await fetch("/api/cashback",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"click",offerId:b.dataset.id})}),d=await r.json();if(d.trackingUrl)location.href=d.trackingUrl;else alert(d.error||"Offre indisponible.")})}go()</script>
