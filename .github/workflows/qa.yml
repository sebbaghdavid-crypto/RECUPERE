name: RÉCUPÈRE QA
on:
  push:
    branches: [main, fix/form-submission-reliability, fix/cashback-ledger-integrity, chore/reproducible-install-lockfile]
  pull_request:
    branches: [main, fix/form-submission-reliability, fix/cashback-ledger-integrity]
permissions:
  contents: write
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for f in netlify/functions/*.mjs; do
            echo "Checking $f"
            node --check "$f"
          done
      - name: Generate complete npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: recupere-generated-lockfile
          path: package-lock.json
          if-no-files-found: error
      - name: Verify clean dependency installation
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run regression tests
        run: node --test qa/*.test.mjs
      - name: Commit generated lockfile on the lockfile branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/chore/reproducible-install-lockfile'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Generate complete npm dependency lockfile"
          git push

concurrency:
  group: recupere-qa-${{ github.ref }}
  cancel-in-progress: true
